# Site settings
author: Jamie Simon
email: jsi@berkeley.edu
description: "Jamie Simon — ML researcher and writer. Personal site with blog posts on machine learning theory, math, physics, and science."
baseurl: "" # the subpath of your site, e.g. /blog

title: Jamie Simon
url: "https://jamiesimon.io"
imgurl: "/img"

github_username:  james-simon
insta_username: sam.simon17
gscholar_url:  "https://scholar.google.com/citations?user=zjGfh3sAAAAJ&hl=en"

DBL: "https://dl.dropboxusercontent.com/u/16348658"
excerpt_separator: <!--exc-->

# remove category and date from post urls
permalink: /blog/:title/

collections:
  puzzles:
    name: Puzzles
    output: true
  crosswords:
    name: Crosswords
    output: false

# Build settings
markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-sitemap

# Notes for Claude stay on disk but off the site. Setting this list replaces Jekyll's default
# one, so the Gemfile and vendor entries have to be repeated here.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - CLAUDE.md
  - claude_notes.md
  - expander-nets/CLAUDE_NOTES.md
  - expander-nets/REFACTOR_SUMMARY.md
  - low-dim-flows/REFACTOR_SUMMARY.md
  - tensorizer/claude_notes.md
  - tensorizer/_site/claude_notes.md

# Unlisted draft of the Redwood Center site (a static Astro build, so no front matter of its own):
# keep its pages out of the sitemap. The pages also carry a noindex meta tag.
defaults:
  - scope:
      path: "draft-redwood-website"
    values:
      sitemap: false
