---
layout: none
permalink: /
---
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10122a">
  <title>Jamie Simon</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ site.baseurl }}/img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ site.baseurl }}/img/favicon-16x16.png">
  <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}/">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ "/feed.xml" | prepend: site.baseurl | prepend: site.url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Silkscreen&display=swap" rel="stylesheet">
  {% include page-transition.html home=true %}
  <style>
    :root {
      --line: 20px;
      --bg: #10122a;
      --ink: #d3d7ee;
      --accent: #b9bdd0; /* replaced by the accent of the photo drawn */
      --glow: 0px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { background: var(--bg); }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: calc(var(--line) * 2) 16px;
      color: var(--ink);
      font: 400 15px/var(--line) "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
      -webkit-text-size-adjust: 100%;
    }

    /* The page's dark background, as its own element so it can turn into the nav bar of other
       pages (see page-transition.html). */
    .night {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: var(--bg);
      view-transition-name: night;
    }

    #content {
      width: min(100%, 576px);
      padding: 0 18px;
      view-transition-name: home-content;
    }

    .photo {
      position: relative;
      width: 240px;
      height: 240px;
      margin: 0 auto calc(var(--line) * 2);
    }

    .photo img {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #1c1f42;
      box-shadow: 0 0 0 4px var(--bg), 0 0 0 7px var(--accent), 0 0 var(--glow) 7px var(--accent);
    }

    #odds, #copied {
      position: absolute;
      left: 50%;
      bottom: -14px;
      z-index: 2;
      padding: 3px 9px 4px;
      white-space: nowrap;
      color: var(--accent);
      background: var(--bg);
      border: 2px solid var(--accent);
      font: 400 14px/18px "Silkscreen", "IBM Plex Mono", monospace;
      visibility: hidden;
      transform: translateX(-50%);
    }

    #odds.show { animation: odds-pop 3.6s steps(1, end) forwards; }

    .links { text-align: center; }
    .link-group { white-space: nowrap; }

    /* Too wide for one line on phones, so it breaks between the two groups. */
    @media (max-width: 480px) {
      #content { padding: 0; }
      .link-group { display: block; }
      .link-sep { display: none; }
    }

    .copy { position: relative; }
    #copied { bottom: calc(100% + 6px); }
    #copied.show { animation: copied-pop 1.5s steps(1, end) forwards; }

    @keyframes copied-pop {
      0%   { visibility: visible; transform: translate(-50%, 8px) scale(.7); }
      6%   { visibility: visible; transform: translate(-50%, -4px) scale(1.15); }
      12%  { visibility: visible; transform: translate(-50%, 0) scale(1); }
      90%, 100% { visibility: hidden; transform: translate(-50%, 0); }
    }

    /* Stepped on purpose: it should snap between positions like a sprite, not glide. */
    @keyframes odds-pop {
      0%   { visibility: visible; transform: translate(-50%, 18px) scale(.6); }
      2.5% { visibility: visible; transform: translate(-50%, 8px) scale(1.2); }
      5%   { visibility: visible; transform: translate(-50%, -6px) scale(1.08); }
      7.5% { visibility: visible; transform: translate(-50%, 0) scale(1); }
      84%  { visibility: hidden;  transform: translate(-50%, 0); }
      87%  { visibility: visible; transform: translate(-50%, 0); }
      90%  { visibility: hidden;  transform: translate(-50%, 0); }
      93%  { visibility: visible; transform: translate(-50%, 0); }
      96%, 100% { visibility: hidden; transform: translate(-50%, 0); }
    }

    h1 { font: 600 15px/var(--line) "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; color: #fff; }

    p { margin-top: var(--line); text-wrap: pretty; }

    a { color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 1px; }
    a:hover { color: #fff; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* Arriving from another page: its nav bar drops down to fill the screen, then the words fade in. */
    html[data-transition="to-home"]::view-transition-old(root) { animation: none; }
    html[data-transition="to-home"]::view-transition-new(root) { animation: none; opacity: 0; }
    html[data-transition="to-home"]::view-transition-group(night) {
      overflow: clip;
      animation-duration: 380ms;
      animation-timing-function: cubic-bezier(.6, 0, .25, 1);
      animation-fill-mode: both;
    }
    html[data-transition="to-home"]::view-transition-old(night) { animation: none; mix-blend-mode: normal; }
    html[data-transition="to-home"]::view-transition-new(night) {
      height: 100%;
      animation: night-in 120ms ease-out both;
      mix-blend-mode: normal;
    }
    html[data-transition="to-home"]::view-transition-new(home-content) { animation: home-in 240ms 330ms ease-out both; }
    @keyframes night-in { from { opacity: 0; } }
    @keyframes home-in { from { opacity: 0; transform: scale(.98); } }

    @media (prefers-reduced-motion: reduce) {
      #odds.show { animation: odds-still 3.6s steps(1, end) forwards; }
      #copied.show { animation: odds-still 1.5s steps(1, end) forwards; }
      @keyframes odds-still {
        0%, 90% { visibility: visible; }
        100% { visibility: hidden; }
      }
    }
  </style>
</head>
<body>
  <div class="night" aria-hidden="true"></div>

  <main id="content">
    <div class="photo">
      <img id="photo" alt="Jamie Simon" width="240" height="240">
      <div id="odds" role="status"></div>
    </div>
    <noscript><p>Turn on JavaScript to see a photo.</p></noscript>

    <h1>Hi! I'm Jamie Simon.</h1>
    <p>I run the <a href="https://flab.world/">Feature Lab</a>, an academic lab at UC Berkeley dedicated to building fundamental scientific understanding of AI.</p>
    <p class="links">
      <span class="link-group">
        <a href="{{ site.baseurl }}/research/">research</a> ·
        <a href="{{ site.baseurl }}/blog/">blog</a> ·
        <a href="{{ site.baseurl }}/about/">about</a>
      </span>
      <span class="link-sep">·</span>
      <span class="link-group">
        <span class="copy"><a id="email" href="mailto:{{ site.email }}" aria-label="Copy email address">email</a><span id="copied" role="status"></span></span> ·
        <a href="{{ site.gscholar_url }}">gScholar</a> ·
        <a href="https://x.com/learning_mech">X</a>
      </span>
    </p>
  </main>

  <!-- Photo, rarity and accent color -->
  <script>
    // Edit this list to change the photos. Weights don't need to add up to 100: the odds
    // shown are always weight / total. Accent is a color from the photo, used for the ring,
    // links and cursor, and it needs to stay light enough to read on the dark background.
    const PHOTOS = [
      { file: 'me_at_collingwood_house_1.jpg', weight: 50, accent: '#22d8e6', alt: 'Jamie smiling and looking off to one side' },
      { file: 'me_in_glacier.jpg',             weight: 10, accent: '#ff8fa3', alt: 'Jamie with a big backpack among burned trees in Glacier' },
      { file: 'me_in_tux.jpg',                 weight: 10, accent: '#4a86ff', alt: 'Jamie in a tux and a striped bow tie' },
      { file: 'me_walking_in_texas.jpg',       weight: 10, accent: '#f25cf2', alt: 'Jamie in a straw cowboy hat walking along a rocky shore in Texas' },
      { file: 'me_with_gravitree.jpg',         weight: 5, accent: '#ff4d4d', alt: 'Jamie in red patterned pants holding up a gravitree' },
      { file: 'me_with_lizard.jpg',            weight: 5, accent: '#1fe0a8', alt: 'Jamie seen from behind, with a lizard on the back of a gray hoodie' },
      { file: 'me_in_sibley_volcanic.jpg',     weight: 0, accent: '#ff8a1f', alt: 'Selfie of Jamie in a foggy forest at Sibley' },
      { file: 'me_grinding.jpg',               weight: 2, accent: '#b77dff', alt: 'Jamie holding up The Unofficial Guide to Climbing the Corporate Ladder' },
      { file: 'dolly_spartan_me.jpg',          weight: 2, accent: '#ff4fa3', alt: 'Jamie in a red cowboy hat, sunglasses and a pink bandana' },
      { file: 'me_surfing.jpg',                weight: 2, accent: '#fff04d', alt: 'Jamie surfing in a yellow shirt' },
      { file: 'me_on_ski_lift.jpg',            weight: 1, accent: '#5cc2ff', alt: 'Jamie in a balaclava and goggles on a ski lift' },
      { file: 'me_on_rock.jpg',                weight: 1, accent: '#a4e635', alt: 'Jamie sitting on a mossy rock among autumn trees' },
      { file: 'baby_me.jpg',                   weight: 1, accent: '#8f8bff', alt: 'Jamie as a baby' },
      { file: 'me_on_mechanical_bull.webp',    weight: 0.5, accent: '#3fe04f', alt: 'Jamie riding a mechanical bull in a bar' },
      { file: 'baby_me_in_goldfish.jpg',       weight: 0.5, accent: '#ffba1f', alt: 'Baby Jamie crying in a tub full of goldfish crackers' },
    ];

    // Rarity by odds, rarest first: a photo gets the first row its odds are under.
    const RARITIES = [
      { under: 1,        name: 'MYTHIC',     glow: '28px' },
      { under: 2,        name: 'LEGENDARY',  glow: '16px' },
      { under: 5,        name: 'SUPER RARE', glow: '8px'  },
      { under: 10,       name: 'RARE',       glow: '0px'  },
      { under: 25,       name: 'UNCOMMON',   glow: '0px'  },
      { under: Infinity, name: 'COMMON',     glow: '0px'  },
    ];

    (function () {
      const total = PHOTOS.reduce((sum, p) => sum + p.weight, 0);
      let roll = Math.random() * total;
      const pick = PHOTOS.find(p => (roll -= p.weight) < 0) || PHOTOS[0];
      const odds = pick.weight / total * 100;
      const rarity = RARITIES.find(r => odds < r.under);

      const root = document.documentElement.style;
      root.setProperty('--accent', pick.accent);
      root.setProperty('--glow', rarity.glow);

      const img = document.getElementById('photo');
      const badge = document.getElementById('odds');
      let shown = false;
      const announce = () => {
        if (shown) return;
        shown = true;
        // Waits for the page transition, if one is playing, so the pop isn't missed.
        Promise.resolve(window.pageTransition).finally(() => {
          badge.textContent = 'PHOTO RARITY: ' + rarity.name + ' (' + Number(odds.toFixed(1)) + '%)';
          badge.classList.add('show');
        });
      };
      img.addEventListener('load', announce);
      img.addEventListener('error', announce);
      img.alt = pick.alt;
      img.src = '{{ site.baseurl }}/img/pictures_of_me/circle/' + pick.file;
    })();
  </script>

  <!-- Click "email" to copy the address -->
  <script>
    (function () {
      const ADDRESS = '{{ site.email }}';
      const link = document.getElementById('email');
      const popup = document.getElementById('copied');

      function copyWithSelection() {
        const box = document.createElement('textarea');
        box.value = ADDRESS;
        box.style.position = 'fixed';
        box.style.opacity = '0';
        document.body.appendChild(box);
        box.select();
        let worked = false;
        try { worked = document.execCommand('copy'); } catch (e) {}
        box.remove();
        return worked;
      }

      async function copy() {
        try {
          await navigator.clipboard.writeText(ADDRESS);
          return true;
        } catch (e) {
          return copyWithSelection();
        }
      }

      link.addEventListener('click', async e => {
        e.preventDefault();
        const worked = await copy();
        // If copying is blocked, show the address so it can still be copied by hand.
        popup.textContent = worked ? 'copied' : ADDRESS;
        popup.classList.remove('show');
        void popup.offsetWidth; // restarts the animation on repeat clicks
        popup.classList.add('show');
      });
    })();
  </script>
</body>
</html>
