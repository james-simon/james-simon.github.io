      const py = v => M.t + hh - (ty(Math.max(v, spec.ylog ? 1e-300 : -Infinity)) - ty(y0)) / (ty(y1) - ty(y0)) * hh;
      const g = svgEl('g', {'font-family': 'Georgia, serif', 'font-size': 11}, svg);

        svgEl('text', {x: M.l - 6, y: Y + 4, 'text-anchor': 'end', fill: C.muted}, g).textContent = yv(v, ydec);
      }

        const X = px(v);
        if (X < M.l - 1 || X > M.l + w + 1) continue;
        svgEl('line', {x1: X, x2: X, y1: M.t, y2: M.t + hh, stroke: C.grid, 'stroke-width': 1}, g);
        svgEl('text', {x: X, y: M.t + hh + 15, 'text-anchor': 'middle', fill: C.muted}, g).textContent =
          spec.xticks && spec.xticklabels ? spec.xticklabels[k] : fmt(v, spec.xfmt);
      }
      svgEl('line', {x1: M.l, x2: M.l + w, y1: M.t + hh, y2: M.t + hh, stroke: C.axis, 'stroke-width': 1}, g);
      (spec.hlines || []).forEach(l => {
        const Y = py(l.y);
        svgEl('line', {x1: M.l, x2: M.l + w, y1: Y, y2: Y, stroke: C.muted, 'stroke-width': 1, 'stroke-dasharray': '5 4'}, g);
        if (l.label) svgEl('text', {x: M.l + w - 4, y: Y - 4, 'text-anchor': 'end', fill: C.muted, 'font-size': 10}, g).textContent = l.label;
      });
      (spec.vlines || []).forEach(l => {
        const X = px(l.x);
        svgEl('line', {x1: X, x2: X, y1: M.t, y2: M.t + hh, stroke: C.muted, 'stroke-width': 1, 'stroke-dasharray': '5 4'}, g);
        if (l.label) svgEl('text', {x: X + 4, y: M.t + 10, 'text-anchor': 'start', fill: C.muted, 'font-size': 10}, g).textContent = l.label;
      });
      const clip = 'clip' + Math.random().toString(36).slice(2);
      svgEl('rect', {x: M.l, y: M.t - 4, width: w, height: hh + 8}, svgEl('clipPath', {id: clip}, svg));
      const body = svgEl('g', {'clip-path': `url(#${clip})`}, svg);
      const groups = [];
      vis.forEach(s => {

        groups.push({s, g: sg});

          const d = band.map((p, i) => (i ? 'L' : 'M') + px(p[0]) + ',' + py(p[3])).join('') +
                    band.slice().reverse().map(p => 'L' + px(p[0]) + ',' + py(p[2])).join('') + 'Z';
          svgEl('path', {d, fill: s.color, 'fill-opacity': 0.12, stroke: 'none'}, sg);
        } else band.forEach(p => svgEl('line', {x1: px(p[0]), x2: px(p[0]), y1: py(p[2]), y2: py(p[3]),

        if ((s.line ?? spec.lines !== false) && pts.length > 1)
          svgEl('path', {d: pts.map((p, i) => (i ? 'L' : 'M') + px(p[0]) + ',' + py(p[1])).join(''), fill: 'none',
                         stroke: s.color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round',
                         'stroke-dasharray': s.dash ? '6 4' : ''}, sg);

        const dot = spec.lines === false ? {'fill-opacity': spec.alpha ?? 0.6, 'class': 'ri-dot'}  // scatter: translucent, no outline, so overlaps show
                                         : {stroke: C.surface, 'stroke-width': 2};
        const R = spec.r || 4, sym = s.symbol || 'circle';
        const mark = (x, y) => {  // series.symbol: circle (default), square, triangle, diamond
          if (sym === 'square') return svgEl('rect', {x: x - R, y: y - R, width: 2 * R, height: 2 * R, fill: s.color, ...dot}, sg);
          if (sym === 'triangle') return svgEl('path', {d: `M${x},${y - 1.25 * R} L${x + 1.15 * R},${y + 0.75 * R} L${x - 1.15 * R},${y + 0.75 * R} Z`, fill: s.color, ...dot}, sg);
          if (sym === 'diamond') return svgEl('path', {d: `M${x},${y - 1.3 * R} L${x + 1.3 * R},${y} L${x},${y + 1.3 * R} L${x - 1.3 * R},${y} Z`, fill: s.color, ...dot}, sg);

      const my = Y == null ? ev.clientY - r.top : Y / state.W * r.width;

      if (!state) return;

    c2.forEach((n, k) => { if (!n) return; const y1 = py(-lim + (k + 1) * bw), y0 = py(-lim + k * bw), w = n / cmax * MH; g.fillRect(X0 + SQ + GAP, y1, w, Math.max(1, y0 - y1 - 0.5)); });
    g.strokeStyle = '#c3c2b7'; g.beginPath(); g.moveTo(X0, M.t + MH + 0.5); g.lineTo(X0 + SQ, M.t + MH + 0.5); g.moveTo(X0 + SQ + GAP + 0.5, Y0); g.lineTo(X0 + SQ + GAP + 0.5, Y0 + SQ); g.stroke();
    if (c.gauss) {
      g.strokeStyle = '#222'; g.lineWidth = 1.5; g.setLineDash([6, 4]);
      g.beginPath(); for (let k = 0; k <= 160; k++) { const y = -lim + 2 * lim * k / 160, X = px(y), Y = M.t + MH - dens(y, K[0]) / cmax * MH; if (k) g.lineTo(X, Y); else g.moveTo(X, Y); } g.stroke();
      g.beginPath(); for (let k = 0; k <= 160; k++) { const y = -lim + 2 * lim * k / 160, Y = py(y), X = X0 + SQ + GAP + dens(y, K[2]) / cmax * MH; if (k) g.lineTo(X, Y); else g.moveTo(X, Y); } g.stroke();
      g.setLineDash([]);
    }
  }

  // ---- computing the draws ----
  const status = $('nn2-status');
  const seed = (Math.random() * 4294967296) >>> 0;
  let gen = 0, running = false, enginePromise = null;
  async function gpuEngine() {
    if (!navigator.gpu) return null;
    const adapter = await navigator.gpu.requestAdapter({powerPreference: 'high-performance'});
    if (!adapter) return null;
    const device = await adapter.requestDevice();
    const pipeline = device.createComputePipeline({layout: 'auto', compute: {module: device.createShaderModule({code: WGSL}), entryPoint: 'main'}});
    const ubuf = device.createBuffer({size: 32, usage: 0x40 | 8});
    let out = {n: 0, buf: null, stage: null}, chain = Promise.resolve();
    function output(n) {
      if (n <= out.n) return out;
      if (out.buf) { out.buf.destroy(); out.stage.destroy(); }
      out = {n, buf: device.createBuffer({size: n * 4, usage: 0x80 | 4}), stage: device.createBuffer({size: n * 4, usage: 1 | 8})};
      return out;
    }
    async function forward(c, L, s0, S) {
      const o = output(2 * S);
      const ub = new ArrayBuffer(32), u32 = new Uint32Array(ub), f32 = new Float32Array(ub);
      u32.set([c.width, s0, seed, S]); f32.set([L[0], L[1], L[2], 0], 4);
      device.queue.writeBuffer(ubuf, 0, ub);
      const bg = device.createBindGroup({layout: pipeline.getBindGroupLayout(0), entries: [{binding: 0, resource: {buffer: ubuf}}, {binding: 1, resource: {buffer: o.buf}}]});
      const enc = device.createCommandEncoder(), pass = enc.beginComputePass();
      pass.setPipeline(pipeline); pass.setBindGroup(0, bg); pass.dispatchWorkgroups(Math.ceil(S / 64)); pass.end();
      enc.copyBufferToBuffer(o.buf, 0, o.stage, 0, 2 * S * 4);
      device.queue.submit([enc.finish()]);
      await o.stage.mapAsync(1, 0, 2 * S * 4);
      const res = new Float32Array(o.stage.getMappedRange(0, 2 * S * 4).slice(0));
      o.stage.unmap();
      return res;
    }
    return {name: 'WebGPU', forward(c, L, s0, S) { const p = chain.then(() => forward(c, L, s0, S)); chain = p.catch(() => {}); return p; }};
  }
  function cpuEngine() {
    function rng(s) { let a = (s ^ seed) >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
    return {name: 'CPU (no WebGPU)', async forward(c, L, s0, S) {
      const res = new Float32Array(2 * S);
      for (let s = 0; s < S; s++) {
        const u = rng(s0 + s), gauss = () => Math.sqrt(-2 * Math.log(1 - u())) * Math.cos(2 * Math.PI * u());
        let f1 = 0, f2 = 0;
        for (let j = 0; j < c.width; j++) { const z1 = gauss(), z2 = gauss(), w = gauss(); f1 += w * Math.max(L[0] * z1, 0); f2 += w * Math.max(L[1] * z1 + L[2] * z2, 0); }
        const sc = 1 / Math.sqrt(c.width);
        res[2 * s] = f1 * sc; res[2 * s + 1] = f2 * sc;
        if ((s & 63) === 63) await new Promise(r => setTimeout(r, 0));
      }
      return res;
    }};
  }
  function engine() { return enginePromise || (enginePromise = gpuEngine().catch(() => null).then(e => e || cpuEngine())); }
  async function run() {
    const my = ++gen; running = true;
    const eng = await engine(); if (gen !== my) return;
    const c = cfg(), L = chol(K1()), t0 = performance.now(); let B = 64, timedOut = false;
    while (samples.length / 2 < cfg().ns) {
      if (performance.now() - t0 > 10000) { timedOut = true; break; }
      const have = samples.length / 2, b = Math.min(B, cfg().ns - have), t1 = performance.now();
      let res;
      try { res = await eng.forward(c, L, have, b); } catch (e) { status.textContent = eng.name + ' failed: ' + e.message; running = false; return; }
      if (gen !== my) return;
      const next = new Float32Array(samples.length + res.length); next.set(samples); next.set(res, samples.length); samples = next;
      const dt = performance.now() - t1;
      if (dt < 250) B = Math.min(B * 2, 10000); else if (dt > 700) B = Math.max(1, B >> 1);
      draw();
      status.textContent = `${samples.length / 2} / ${cfg().ns} trials, ${((performance.now() - t0) / 1000).toFixed(1)} s, ${eng.name}`;
    }
    running = false;
    if (timedOut) status.textContent = `stopped at 10 s: ${samples.length / 2} of ${cfg().ns} trials (${eng.name})`;
    else status.textContent = `${samples.length / 2} trials in ${((performance.now() - t0) / 1000).toFixed(1)} s, ${eng.name}`;
  }
  function restart() { gen++; samples = new Float32Array(0); draw(); run(); }

  // ---- wiring ----
  function showPair() { $('nn2-img1').src = POOL.png[pair[0]]; $('nn2-img2').src = POOL.png[pair[1]]; $('nn2-img1').title = POOL.labels[pair[0]]; $('nn2-img2').title = POOL.labels[pair[1]]; }
  function readouts() { const c = cfg(); $('nn2-width-v').textContent = c.width; $('nn2-ns-v').textContent = c.ns; }
  function arch() { readouts(); persist(); showPair(); restart(); }
  el.width.addEventListener('input', arch);
  el.ns.addEventListener('input', () => { readouts(); persist(); draw(); if (!running && samples.length / 2 < cfg().ns) run(); });
  el.gauss.addEventListener('input', () => { persist(); draw(); });
  $('nn2-new').addEventListener('click', () => { pair = [pick(), pick()]; arch(); });
  $('nn2-f1').addEventListener('click', () => { pair = [pick(), pair[1]]; arch(); });
  $('nn2-f2').addEventListener('click', () => { pair = [pair[0], pick()]; arch(); });
  arch();
  window.__nn01b = {samples: () => samples, cfg, pair: () => pair, K2, running: () => running, setPair: p => { pair = p; arch(); }};  // for scripts/check01.js
})();
</script>

tabs.forEach(x=>x.hidden=x!==t);links.forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+t.dataset.tab));
